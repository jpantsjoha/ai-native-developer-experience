name: DX Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ════════════════════════════════════════════════════
  # DETERMINISTIC: Markdown Quality
  # ════════════════════════════════════════════════════
  lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

  # ════════════════════════════════════════════════════
  # DETERMINISTIC: Operating-model contract and regression tests
  # ════════════════════════════════════════════════════
  operating-model:
    name: Operating Model Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile bootstrap scripts
        run: make typecheck
      - name: Run operating-model regression tests
        run: make test

  # ════════════════════════════════════════════════════
  # DETERMINISTIC: Agent Plugins 1.0.0 + Agent Skills conformance
  # https://agent-plugins.org/specification
  # ════════════════════════════════════════════════════
  spec-conformance:
    name: Agent Plugins Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate against Agent Plugins 1.0.0
        run: make spec-conformance
