<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DevEx Charter mascot: a fox with a gold monocle and a pipe whose smoke forms a green tick">
  <title>DevEx Charter fox - The Reviewer</title>
  <rect width="512" height="512" rx="96" fill="#FFF4E2"/>
  <g transform="translate(-32 6)" stroke="#1E2633" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <path d="M118 214 Q96 120 112 50 Q176 82 226 150 Z" fill="#F26B1D"/>
    <path d="M394 214 Q416 120 400 50 Q336 82 286 150 Z" fill="#F26B1D"/>
    <path d="M136 168 Q130 120 136 92 Q168 112 190 142 Z" fill="#1E2633" stroke="none"/>
    <path d="M376 168 Q382 120 376 92 Q344 112 322 142 Z" fill="#1E2633" stroke="none"/>
    <!-- head -->
    <path d="M70 306 C72 214 150 146 256 146 C362 146 440 214 442 306 C404 334 356 352 318 392 Q256 450 194 392 C156 352 108 334 70 306 Z" fill="#F26B1D"/>
    <!-- cream cheeks and muzzle -->
    <path d="M70 306 C126 282 184 290 222 328 Q256 352 290 328 C328 290 386 282 442 306 C404 334 356 352 318 392 Q256 450 194 392 C156 352 108 334 70 306 Z" fill="#FFF4E2" stroke="none"/>
    <path d="M78 302 C130 284 184 290 222 328 Q256 352 290 328 C328 290 382 284 434 302" fill="none" stroke-width="9"/>
  </g>
  <g transform="translate(-32 6)">
    <!-- brows: one level, one lifted (the reviewer's raised eyebrow) -->
    <path d="M172 222 Q196 210 222 218" fill="none" stroke="#1E2633" stroke-width="12" stroke-linecap="round"/>
    <path d="M290 206 Q318 190 346 202" fill="none" stroke="#1E2633" stroke-width="12" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="198" cy="262" rx="19" ry="24" fill="#1E2633"/>
    <ellipse cx="318" cy="262" rx="19" ry="24" fill="#1E2633"/>
    <circle cx="205" cy="253" r="7" fill="#FFFFFF"/>
    <circle cx="325" cy="253" r="7" fill="#FFFFFF"/>
    <!-- monocle -->
    <circle cx="318" cy="262" r="44" fill="none" stroke="#F2B33D" stroke-width="14"/>
    <circle cx="318" cy="262" r="51" fill="none" stroke="#1E2633" stroke-width="4"/>
    <circle cx="318" cy="262" r="37" fill="none" stroke="#1E2633" stroke-width="4"/>
    <!-- nose and smile -->
    <path d="M232 372 Q256 362 280 372 Q270 394 256 396 Q242 394 232 372 Z" fill="#1E2633" stroke="#1E2633" stroke-width="6" stroke-linejoin="round"/>
    <path d="M236 414 Q258 424 284 408" fill="none" stroke="#1E2633" stroke-width="10" stroke-linecap="round"/>
    <!-- pipe -->
    <path d="M280 410 Q330 420 372 400" fill="none" stroke="#1E2633" stroke-width="14" stroke-linecap="round"/>
    <path d="M362 368 L430 368 L428 402 Q424 446 396 446 Q368 446 364 402 Z" fill="#8A4B24" stroke="#1E2633" stroke-width="12" stroke-linejoin="round"/>
    <rect x="356" y="360" width="82" height="16" rx="8" fill="#1E2633"/>
  </g>
  <!-- smoke rising into a tick -->
  <path d="M336 312 L368 344 L472 226" fill="none" stroke="#FFF4E2" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M336 312 L368 344 L472 226" fill="none" stroke="#1E9E63" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
